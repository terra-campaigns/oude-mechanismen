# Minimal fixture vault for the headless dynamic-gem test
# (tests/test_dynamic_gem.rb, issue #23). Deliberately theme-free so the
# build only needs the jekyll and oude-mechanismen gems.
title: "Fixture Vault"
description: "Deterministic fixture site for the oude-mechanismen dynamic-gem test."

plugins:
  - oude-mechanismen

permalink: pretty

exclude:
  - ".agents"
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - "vendor"
