name: Antigravity Review Request

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
    branches: ["main", "before-publish"]
  push:
    branches: ["main"]
    paths:
      - "docs/adr/**"
      - "docs/designs/**"
      - "skills/**"
      - "scripts/**"
      - "src/**"

jobs:
  detect-review-request:
    runs-on: ubuntu-latest
    outputs:
      request-review: ${{ steps.check.outputs.request-review }}
      review-type: ${{ steps.check.outputs.review-type }}
      pr-number: ${{ steps.check.outputs.pr-number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for review request
        id: check
        run: |
          # Check if this is a PR event
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_BODY="${{ github.event.pull_request.body }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_TITLE=""
            PR_BODY=""
            PR_NUMBER=""
          fi

          # Check commit messages for review tags
          if [ "${{ github.event_name }}" = "push" ]; then
            # Get the most recent commit message
            COMMIT_MSG=$(git log -1 --pretty=%B)
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Get all commit messages in the PR
            COMMIT_MSG=$(git log --oneline ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | head -1)
          fi

          # Check for review request tags
          if echo "$PR_TITLE $PR_BODY $COMMIT_MSG" | grep -q "\[REVIEW-REQUESTED\]"; then
            echo "request-review=true" >> $GITHUB_OUTPUT
            
            # Determine review type
            if echo "$PR_TITLE $PR_BODY $COMMIT_MSG" | grep -q "\[FULL-REVIEW\]"; then
              echo "review-type=full" >> $GITHUB_OUTPUT
            elif echo "$PR_TITLE $PR_BODY $COMMIT_MSG" | grep -q "\[ADR-REVIEW\]"; then
              echo "review-type=adr" >> $GITHUB_OUTPUT
            else
              echo "review-type=standard" >> $GITHUB_OUTPUT
            fi
            
            echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT
          else
            echo "request-review=false" >> $GITHUB_OUTPUT
            echo "review-type=none" >> $GITHUB_OUTPUT
            echo "pr-number=" >> $GITHUB_OUTPUT
          fi

  request-antigravity-review:
    needs: detect-review-request
    if: needs.detect-review-request.outputs.request-review == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Get changed files in PR
            FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | tr '\n' ' ')
          else
            # Get changed files in push
            FILES=$(git diff --name-only ${{ github.event.before }}..${{ github.event.after }} | tr '\n' ' ')
          fi
          
          echo "changed-files=$FILES" >> $GITHUB_OUTPUT
          
          # Categorize changes
          ADR_CHANGES=$(echo "$FILES" | grep -oE "docs/adr/[^ ]*" | tr ' ' '\n' | wc -l)
          DESIGN_CHANGES=$(echo "$FILES" | grep -oE "docs/designs/[^ ]*" | tr ' ' '\n' | wc -l)
          SKILL_CHANGES=$(echo "$FILES" | grep -oE "skills/[^ ]*" | tr ' ' '\n' | wc -l)
          SCRIPT_CHANGES=$(echo "$FILES" | grep -oE "scripts/[^ ]*" | tr ' ' '\n' | wc -l)
          SRC_CHANGES=$(echo "$FILES" | grep -oE "src/[^ ]*" | tr ' ' '\n' | wc -l)
          
          echo "adr-changes=$ADR_CHANGES" >> $GITHUB_OUTPUT
          echo "design-changes=$DESIGN_CHANGES" >> $GITHUB_OUTPUT
          echo "skill-changes=$SKILL_CHANGES" >> $GITHUB_OUTPUT
          echo "script-changes=$SCRIPT_CHANGES" >> $GITHUB_OUTPUT
          echo "src-changes=$SRC_CHANGES" >> $GITHUB_OUTPUT

      - name: Create review stub document
        run: |
          PR_NUMBER=${{ needs.detect-review-request.outputs.pr-number }}
          REVIEW_TYPE=${{ needs.detect-review-request.outputs.review-type }}
          REVIEW_DATE=$(date +%Y-%m-%d)
          
          # Determine review document name
          if [ -n "$PR_NUMBER" ]; then
            REVIEW_DOC="docs/reviews/pr_${PR_NUMBER}_review.md"
            TARGET="PR #${PR_NUMBER}"
          else
            # For push events, use commit SHA
            COMMIT_SHA=${{ github.sha }}
            SHORT_SHA=${COMMIT_SHA:0:8}
            REVIEW_DOC="docs/reviews/commit_${SHORT_SHA}_review.md"
            TARGET="commit ${SHORT_SHA}"
          fi
          
          # Create review stub
          cat > "$REVIEW_DOC" << EOF
# Goldfish Review: ${TARGET}

**Review Target:** ${TARGET}  
**Reviewer:** Antigravity (Zero-Context Goldfish Reviewer)  
**Date:** ${REVIEW_DATE}  
**Verdict:** Pending  
**Review Type:** ${REVIEW_TYPE}

---

## Executive Summary

*Pending Antigravity review*

---

## Changes Under Review

${{ steps.changed-files.outputs.changed-files }}

---

## Adversarial Probes

| ID | Area | Invariant Probed | Status |
| :--- | :--- | :--- | :--- |

---

## Detailed Findings

*To be completed by Antigravity review process*
EOF
          
          echo "✓ Created review stub: $REVIEW_DOC"

      - name: Post review request comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ needs.detect-review-request.outputs.pr-number }};
            const reviewType = ${{ needs.detect-review-request.outputs.review-type }};
            const changedFiles = ${{ steps.changed-files.outputs.changed-files }};
            
            let reviewDocName;
            if (prNumber) {
              reviewDocName = `pr_${prNumber}_review.md`;
            } else {
              const shortSha = context.sha.substring(0, 8);
              reviewDocName = `commit_${shortSha}_review.md`;
            }
            
            const adrChanges = ${{ steps.changed-files.outputs.adr-changes }};
            const designChanges = ${{ steps.changed-files.outputs.design-changes }};
            const skillChanges = ${{ steps.changed-files.outputs.skill-changes }};
            const scriptChanges = ${{ steps.changed-files.outputs.script-changes }};
            const srcChanges = ${{ steps.changed-files.outputs.src-changes }};
            
            let scope = [];
            if (adrChanges > 0) scope.push(`${adrChanges} ADR document(s)`);
            if (designChanges > 0) scope.push(`${designChanges} design spec(s)`);
            if (skillChanges > 0) scope.push(`${skillChanges} skill(s)`);
            if (scriptChanges > 0) scope.push(`${scriptChanges} script(s)`);
            if (srcChanges > 0) scope.push(`${srcChanges} source file(s)`);
            
            const body = `🔍 **Antigravity Goldfish Review Requested**

This change has been queued for **${reviewType === 'full' ? 'Full Goldfish Review' : reviewType === 'adr' ? 'ADR-Specific Review' : 'Standard Review'}** in Antigravity.

---

### 📋 Review Details

- **Review Type:** ${reviewType === 'full' ? '🔴 Full (All Probes)' : reviewType === 'adr' ? '🟡 ADR-Specific' : '🟢 Standard'}
- **Review Document:** [docs/reviews/${reviewDocName}](docs/reviews/${reviewDocName})
- **Scope:** ${scope.length > 0 ? scope.join(', ') : 'Automatic detection'}

---

### 🎯 Changes Under Review

${changedFiles.split(' ').filter(f => f).map(f => `- "` + f + '"`').join('\n')}

---

### ⏳ Next Steps

1. **Antigravity** will perform zero-context adversarial probing
2. All invariants will be systematically tested
3. Probes and findings will be documented in [docs/reviews/${reviewDocName}](docs/reviews/${reviewDocName})
4. Review verdict will be posted here

---

*💡 This is an automated request. For manual review override, add "` + '`[SKIP-REVIEW]`' + `
to the PR title or commit message.*

*📖 See [REVIEW_PAIRING.md](docs/REVIEW_PAIRING.md) for the complete pairing workflow.*
`;
            
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              console.log('No PR number found, skipping comment');
            }

      - name: Commit review stub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          PR_NUMBER=${{ needs.detect-review-request.outputs.pr-number }}
          
          if [ -n "$PR_NUMBER" ]; then
            REVIEW_DOC="docs/reviews/pr_${PR_NUMBER}_review.md"
          else
            COMMIT_SHA=${{ github.sha }}
            SHORT_SHA=${COMMIT_SHA:0:8}
            REVIEW_DOC="docs/reviews/commit_${SHORT_SHA}_review.md"
          fi
          
          git add "$REVIEW_DOC"
          git commit -m "docs: create review stub for ${PR_NUMBER:-$SHORT_SHA} [AUTO-GENERATED]"
          git push

  notify-review-complete:
    needs: [detect-review-request, request-antigravity-review]
    if: always() && needs.detect-review-request.outputs.request-review == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ needs.detect-review-request.outputs.pr-number }};
            const body = `❌ **Review Request Failed**

The automated review request encountered an error. Please check the workflow logs.

You can manually request a review by:
1. Creating a review document in "` + '`docs/reviews/`' + `
2. Adding "` + '`[REVIEW-REQUESTED]`' + `
 to the PR title or a commit message
3. Tagging @antigravity for manual review
`;
            
            if (prNumber) {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  validate-review-compliance:
    needs: detect-review-request
    if: needs.detect-review-request.outputs.request-review == 'false' && github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for required review
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          PR_TITLE="${{ github.event.pull_request.title }}"
          
          # Check if this PR had review requested
          if echo "$PR_TITLE" | grep -q "\[REVIEW-REQUESTED\]"; then
            REVIEW_DOC="docs/reviews/pr_${PR_NUMBER}_review.md"
            
            if [ ! -f "$REVIEW_DOC" ]; then
              echo "::error::PR #${PR_NUMBER} had [REVIEW-REQUESTED] but no review document found"
              echo "Expected: $REVIEW_DOC"
              exit 1
            fi
            
            # Check if review is approved
            if ! grep -q "Verdict.*Approved" "$REVIEW_DOC"; then
              echo "::warning::PR #${PR_NUMBER} review document exists but verdict is not 'Approved'"
            fi
            
            # Check for open probes
            OPEN_PROBES=$(grep -c "Status.*Open" "$REVIEW_DOC" || true)
            if [ "$OPEN_PROBES" -gt 0 ]; then
              echo "::error::PR #${PR_NUMBER} has ${OPEN_PROBES} unresolved probe(s)"
              exit 1
            fi
            
            echo "✓ PR #${PR_NUMBER} has valid review approval"
          else
            echo "✓ PR #${PR_NUMBER} did not require review"
          fi
