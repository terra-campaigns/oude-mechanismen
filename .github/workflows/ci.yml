name: CI Health Check

on:
  push:
    branches: [ "main", "before-publish" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and validate Python scripts
        run: |
          python3 -c "import ast, glob; [ast.parse(open(f, 'rb').read(), f) for f in glob.glob('scripts/*.py') + glob.glob('skills/illustrate-entry/scripts/*.py') + glob.glob('tests/*.py')]"

      - name: Run automated unit tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate Ruby plugins syntax
        run: |
          for f in jekyll/_plugins/*.rb; do
            ruby -c "$f"
          done
          for f in lib/*.rb; do
            ruby -c "$f"
          done
          ruby -c lib/oude_mechanismen/version.rb
          gem build oude-mechanismen.gemspec

      - name: Validate Shell scripts syntax
        run: |
          bash -n sync.sh
          bash -n bin/init_vault.sh
          bash -n templates/bin/setup.template
          bash -n githooks/pre-commit
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -s bash sync.sh bin/init_vault.sh templates/bin/setup.template githooks/pre-commit
          fi

      - name: Validate Markdown headings blank line rule
        run: |
          python3 - << 'PY'
          import glob, re, sys
          paths = sorted(set(
              glob.glob("skills/*/SKILL.md")
              + ["README.md", "CHANGELOG.md", "AGENTS.md", "TASKS.md"]
              + glob.glob("templates/*.md.template")
              + glob.glob("templates/jekyll/*.md.template")
          ))
          for path in paths:
              lines = open(path, encoding="utf-8").read().splitlines()
              in_fence = False
              for i, line in enumerate(lines):
                  if re.match(r"^\s*(```|~~~)", line):
                      in_fence = not in_fence
                      continue
                  if not in_fence and re.match(r"^#{1,6}\s", line):
                      if i + 1 < len(lines) and lines[i + 1] != "":
                          print(f"Error: Missing blank line after heading at line {i + 1} in {path}: {lines[i + 1]}", file=sys.stderr)
                          sys.exit(1)
          PY
